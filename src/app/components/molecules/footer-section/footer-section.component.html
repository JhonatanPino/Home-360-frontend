<div
  class="footer-section"
  [ngClass]="{ 'footer-section--social': title === 'Síguenos' }"
>
  <h3 class="footer-section__title">{{ title }}</h3>
  <ul class="footer-section__list">
    <li class="footer-section__item" *ngFor="let item of items">
      <fa-icon
        class="footer-section__icon"
        *ngIf="item.icon"
        [icon]="item.icon"
        data-testid="fa-icon"
      ></fa-icon>
      <span *ngIf="item.text">{{ item.text }}</span>
    </li>
  </ul>
</div>
